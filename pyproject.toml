[build-system]
requires = [
  "scikit-build-core>=1.0",
  "pybind11>=2.13.6",
]
build-backend = "scikit_build_core.build"

[project]
name = "kws-decoder"
version = "0.1.3"
description = "Keyword spotting decoder built with PyBind11"
authors = [
  {name = "Mohammad Hassan Sohan Ajini", email = "mohamad.hasan.sohan.ajini@gmail.com"},
  {name = "Navid Naderi", email = "navid.nadery@gmail.com"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
test = [
  "numpy",
  "pygtrie",
  "pytest",
  "torch",
  "tqdm",
]

ext = [
  "pygtrie",
  "torch",
  "tqdm",
]

[project.urls]
Homepage = "https://github.com/mohamad-hasan-sohan-ajini/kws-decoder"
Repository = "https://github.com/mohamad-hasan-sohan-ajini/kws-decoder"
Issues = "https://github.com/mohamad-hasan-sohan-ajini/kws-decoder/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/kws_decoder"]
cmake.build-type = "Release"

# cibuildwheel is intended for release builds in CI. A compiled extension needs
# a separate wheel for every supported Python/OS/architecture combination.
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
test-command = "python -c \"from kws_decoder import KWSDecoder, Trie\""
